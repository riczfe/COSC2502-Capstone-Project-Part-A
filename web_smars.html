<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Controller</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            background-color: white;
            background-image: url('droneimage.jpg');
        }
        #controller {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        #app-container {
            width: 750px; 
            height: 490px; 
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: fixed;
        }

        #potSlider {
            -webkit-appearance: none;
            appearance: none;
            width: 37%;
            height: 50px;
            transform: rotate(-90deg); /* Rotate slider to vertical */
            border-radius: 50px;
            background: linear-gradient(to right,green, orange, yellow, red) ;
            outline: none;
            cursor: pointer;
            position: absolute;
            top: 270px;
            margin: 0 0 0 -50px;
        }
        h1 {
            margin-top: 0;
        }
        /* Custom slider thumb */
        #potSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 40px;
            height: 80px;
            border-radius: 50%;
            background: black;
            cursor: pointer;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
        }

        #potSlider::-moz-range-thumb {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
        }

        #slider-value {
            margin-bottom:-100px;
            margin-left: 170px;
            font-size: 18px;
            color: #333;
            position: absolute;
            font-style: italic;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            top: 300px;
        }
        #status-box {
            background-color: grey;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 20px;
            right: 690px;
            bottom: 350px;
            position: absolute;
            margin: 0 -363px -40px;
        }

        #emergency-button {
            background-color: red;
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 20px;
            right: 0px;
            position: relative;
            top: 300px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        #emergency-button:hover {
            background-color: darkred;
        }

        #text1 {
            margin-top: 40px;
            margin-left: 50px;
            font-size: 20px;
            text-align: left;
            justify-content: left;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            position: absolute;
        }
        #text2 {
            position: absolute;
            right: 420px;
            font-size: 20px;
            text-align: right;
            justify-content: right;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            margin: 0 -335px -35px;
        }

        /* Disconnected State */
        #status-box.disconnected {
            background-color: grey;
            color: white;
        }

        /* Connected State */
        #status-box.connected {
            background-color: green;
            color: white;
        }

        #joyDiv{
            width:200px;
            height:200px;
            margin: 0 -300px -50px;
            position: absolute;
            right: 350px;
            bottom: 200px;
        }
        #drone-controls {
            position: absolute;
            right: 60px;
            top: 170px;
            width: 200px; 
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .control-button {
            width: 60px;  
            height: 60px; 
            border: none;
            border-radius: 50%;
            font-size: 24px;  
            font-weight: bold;
            color: white;
            background-color: #333;
            position: absolute;
            cursor: pointer;
        }

        #btn-up {
            top: 0;
        }

        #btn-down {
            bottom: 0;
        }

        #btn-left {
            left: 0;
        }

        #btn-right {
            right: 0;
        }

        .control-button:hover {
            background-color: #555;
        }

    </style>
    <script type="text/javascript">
        var JoyStick = function(containerId, options) {
            options = options || {};
            var title = options.title || "joystick",
                width = options.width || 200,
                height = options.height || 200,
                internalFillColor = options.internalFillColor || "#000000",  
                internalLineWidth = options.internalLineWidth || 2,           
                internalStrokeColor = options.internalStrokeColor || "#C70039", 
                externalLineWidth = options.externalLineWidth || 2,            
                externalStrokeColor = options.externalStrokeColor || "#900C3F", 
                externalFillColor = options.externalFillColor || "#52e36e", 
                container = document.getElementById(containerId),
                canvas = document.createElement("canvas");

            canvas.id = title;
            canvas.width = width;
            canvas.height = height;
            container.appendChild(canvas);

            var context = canvas.getContext("2d"),
                pressed = false,
                radius = canvas.width / 2 - 20,
                centerX = canvas.width / 2,
                centerY = canvas.height / 2,
                knobX = centerX,
                knobY = centerY;

            function drawJoystick() {
                context.clearRect(0, 0, canvas.width, canvas.height);

                context.beginPath();
                context.arc(centerX, centerY, radius, 0, Math.PI * 2);
                context.lineWidth = externalLineWidth;
                context.strokeStyle = externalStrokeColor;
                context.stroke();
                context.fillStyle = externalFillColor;
                context.fill();

                context.beginPath();
                context.arc(knobX, knobY, radius / 2, 0, Math.PI * 2);
                var gradient = context.createRadialGradient(knobX, knobY, 5, knobX, knobY, 100);
                gradient.addColorStop(0, internalFillColor);
                gradient.addColorStop(1, internalStrokeColor);
                context.fillStyle = gradient;
                context.fill();
                context.lineWidth = internalLineWidth;
                context.strokeStyle = internalStrokeColor;
                context.stroke();
            }

            canvas.addEventListener("mousedown", function(event) {
                pressed = true;
            });

            canvas.addEventListener("mousemove", function(event) {
                if (pressed) {
                    var rect = canvas.getBoundingClientRect();
                    var dx = event.clientX - rect.left - centerX;
                    var dy = event.clientY - rect.top - centerY;
                    var distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance > radius) {
                        var angle = Math.atan2(dy, dx);
                        dx = radius * Math.cos(angle);
                        dy = radius * Math.sin(angle);
                    }

                    knobX = centerX + dx;
                    knobY = centerY + dy;
                    drawJoystick();
                }
            });

            canvas.addEventListener("mouseup", function() {
                pressed = false;
                knobX = centerX;
                knobY = centerY;
                drawJoystick();
            });

            canvas.addEventListener("mouseleave", function() {
                pressed = false;
                knobX = centerX;
                knobY = centerY;
                drawJoystick();
            });

            drawJoystick();

            this.GetX = function() {
                return ((knobX - centerX) / radius * 100).toFixed();
            }
            this.GetY = function() {
                return ((knobY - centerY) / radius * -100).toFixed();
            }
        };

    </script>
</head>
<body>
    <div id="app-container">
        <h1>Drone Controller</h1>
        <div id="joyDiv" ></div>
        <div id="controller">
            <p id="text1">Slider Control</p>
            <input placeholder="slider" type="range" id="potSlider" min="0" max="100" value="0">
            <div id="slider-value">Value: XX</div>
            <div id="status-box" class="disconnected">Disconnected</div>
            <p id="text2">Direction Control</p>
        </div>
        <div id="drone-controls">
            <button class="control-button" id="btn-up">↑</button>
            <button class="control-button" id="btn-left">←</button>
            <button class="control-button" id="btn-right">→</button>
            <button class="control-button" id="btn-down">↓</button>
        </div>
        <button id="emergency-button">Emergency Stop</button>
    </div>

    <script>
        const statusBox = document.getElementById("status-box");
        let ws;

        try {
            const WS_URL = "ws://" + window.location.host + ":82";
            ws = new WebSocket(WS_URL);

            ws.onopen = function() {
                statusBox.innerText = "Connected";
                statusBox.classList.remove("disconnected");
                statusBox.classList.add("connected");
            };

            ws.onclose = function() {
                statusBox.innerText = "Disconnected";
                statusBox.classList.remove("connected");
                statusBox.classList.add("disconnected");
            };

            ws.onerror = function(error) {
                console.error("WebSocket Error: ", error);
            };
        } catch (e) {
            console.log(e);
        }

        var joy = new JoyStick('joyDiv');
        var potSlider = document.getElementById("potSlider");

        function getMotorValues(nJoyX, nJoyY, sliderValue) {
            var nMotMixL;
            var nMotMixR;
            var fPivYLimit = 32.0;

            var nMotPremixL;
            var nMotPremixR;
            var nPivSpeed;
            var fPivScale;

            if (nJoyY >= 0) {
                nMotPremixL = (nJoyX >= 0 ? 100.0 : 100.0 + parseFloat(nJoyX));
                nMotPremixR = (nJoyX >= 0 ? 100.0 - nJoyX : 100.0);
            } else {
                nMotPremixL = (nJoyX >= 0 ? 100.0 - nJoyX : 100.0);
                nMotPremixR = (nJoyX >= 0 ? 100.0 : 100.0 + parseFloat(nJoyX));
            }

            nMotPremixL = nMotPremixL * nJoyY / 100.0;
            nMotPremixR = nMotPremixR * nJoyY / 100.0;

            nPivSpeed = nJoyX;
            fPivScale = (Math.abs(nJoyY) > fPivYLimit) ? 0.0 : (1.0 - Math.abs(nJoyY) / fPivYLimit);

            nMotMixL = (1.0 - fPivScale) * nMotPremixL + fPivScale * (nPivSpeed);
            nMotMixR = (1.0 - fPivScale) * nMotPremixR + fPivScale * (-nPivSpeed);

            return Math.round(nMotMixL * 2.55) + "," + Math.round(nMotMixR * 2.55) + "," + sliderValue;
        }

        potSlider.oninput = function() {
            var sliderValue = potSlider.value;
            document.getElementById("slider-value").innerText = "Value: " + sliderValue;
            send(getMotorValues(joy.GetX(), joy.GetY(), sliderValue));
            console.log("Slider value:", sliderValue);
        };

        function send(txt) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(txt);
            } else {
                console.error("WebSocket is not open or ready.");
            }
        }

        // Emergency stop button to reset all motors
        document.getElementById("emergency-button").addEventListener("click", function() {
            send("EMERGENCY_STOP");
            potSlider.value = 0;
            potSlider.oninput();  // Trigger the slider input event to reset motors
        });

        // Direction buttons control
        document.getElementById("btn-up").addEventListener("mousedown", function() {
            send("MOVE_UP");
        });
        document.getElementById("btn-down").addEventListener("mousedown", function() {
            send("MOVE_DOWN");
        });
        document.getElementById("btn-left").addEventListener("mousedown", function() {
            send("MOVE_LEFT");
        });
        document.getElementById("btn-right").addEventListener("mousedown", function() {
            send("MOVE_RIGHT");
        });
    </script>
</body>
</html>
