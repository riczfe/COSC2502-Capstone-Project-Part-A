<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Controller</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            background-color: white;
            background-image: url('droneimage.jpg');
        }

        #app-container {
            width: 844px; /* iPhone 13 height in landscape mode */
            height: 390px; /* iPhone 13 width in landscape mode */
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        #controller {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        #slider {
            -webkit-appearance: none;
            appearance: none;
            width: 30%;
            height: 50px;
            transform: rotate(-90deg); /* Rotate slider to vertical */
            margin-top: 120px;
            margin-left: -260px;
            border-radius: 50px;
            background: linear-gradient(to right, green, orange, yellow, red);
            outline: none;
            cursor: pointer;
        }

        #slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 40px;
            height: 80px;
            border-radius: 50%;
            background: black;
            cursor: pointer;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
        }

        #slider-value {
            margin-bottom: -100px;
            margin-left: 170px;
            font-size: 18px;
            color: #333;
            position: absolute;
            font-style: italic;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        #joystick-container {
            width: 200px;
            height: 200px;
            background-color: transparent;
            position: absolute;
            top: 50%;
            left: 65%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <h1>Drone Controller</h1>
        <div id="controller">
            <p id="text1">Slider Control</p>
            <input type="range" id="slider" min="0" max="100" value="0">
            <div id="slider-value">Value: 0</div>

            <p id="text2">Joystick Control</p>
            <div id="joystick-container"></div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Initialize the slider to 0
            const slider = document.getElementById("slider");
            const sliderValueDisplay = document.getElementById("slider-value");
            slider.value = 0;

            // WebSocket initialization
            const view = document.getElementById('stream');
            const WS_URL = "ws://" + window.location.host + ":82";
            const ws = new WebSocket(WS_URL);

            ws.onmessage = message => {
                if (message.data instanceof Blob) {
                    var urlObject = URL.createObjectURL(message.data);
                    view.src = urlObject;
                }
            };

            var lastText, lastSend, sendTimeout;

            function send(txt) {
                var now = new Date().getTime();
                if (lastSend === undefined || now - lastSend >= 30) {
                    try {
                        ws.send(txt);
                        lastSend = new Date().getTime();
                        return;
                    } catch (e) {
                        console.log(e);
                    }
                }
                lastText = txt;
                if (!sendTimeout) {
                    var ms = lastSend !== undefined ? 30 - (now - lastSend) : 30;
                    if (ms < 0) ms = 0;
                    sendTimeout = setTimeout(() => {
                        sendTimeout = null;
                        send(lastText);
                    }, ms);
                }
            }

            // Handle slider change
            slider.addEventListener("input", function() {
                console.log("Slider value:", slider.value);
                sliderValueDisplay.textContent = "Value: " + slider.value;
                send(getMotorValues(joy.GetX(), joy.GetY(), slider.value));
            });

            var potSlider = document.getElementById("slider");
            potSlider.oninput = function() {
                var sliderValue = potSlider.value;
                send(getMotorValues(joy.GetX(), joy.GetY(), sliderValue));
            }

            setInterval(function () {
                send(getMotorValues(joy.GetX(), joy.GetY(), potSlider.value));
            }, 300);

            // Placeholder function for slider value communication
            function sendSliderValueToDrone(value) {
                console.log("Sending slider value to drone:", value);
            }

            // Joystick implementation
            var JoyStick = function(containerId, options) {
                options = options || {};
                var internalFillColor = options.internalFillColor || "#000000",
                    internalStrokeColor = options.internalStrokeColor || "#ffffff",
                    externalStrokeColor = options.externalStrokeColor || "#52e36e",
                    container = document.getElementById(containerId),
                    canvas = document.createElement("canvas");

                canvas.width = 200;
                canvas.height = 200;
                container.appendChild(canvas);

                var context = canvas.getContext("2d"),
                    pressed = false,
                    radius = canvas.width / 2 - 20,
                    centerX = canvas.width / 2,
                    centerY = canvas.height / 2,
                    knobX = centerX,
                    knobY = centerY;

                function drawJoystick() {   
                    context.clearRect(0, 0, canvas.width, canvas.height);

                    // Draw external circle
                    context.beginPath();
                    context.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    context.lineWidth = 2;
                    context.strokeStyle = externalStrokeColor;
                    context.stroke();
                    context.fillStyle = "#52e36e";
                    context.fill();

                    // Draw internal circle
                    context.beginPath();
                    context.arc(knobX, knobY, radius / 2, 0, Math.PI * 2);
                    var gradient = context.createRadialGradient(knobX, knobY, 5, knobX, knobY, 100);
                    gradient.addColorStop(0, internalFillColor);
                    context.fillStyle = gradient;
                    context.fill();
                    context.lineWidth = 2;
                    context.strokeStyle = internalStrokeColor;
                    context.stroke();
                }

                canvas.addEventListener("mousedown", function() {
                    pressed = true;
                });

                canvas.addEventListener("mousemove", function(event) {
                    if (pressed) {
                        var rect = canvas.getBoundingClientRect();
                        var dx = event.clientX - rect.left - centerX;
                        var dy = event.clientY - rect.top - centerY;
                        var distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance > radius) {
                            var angle = Math.atan2(dy, dx);
                            dx = radius * Math.cos(angle);
                            dy = radius * Math.sin(angle);
                        }

                        knobX = centerX + dx;
                        knobY = centerY + dy;
                        drawJoystick();
                    }
                });

                canvas.addEventListener("mouseup", function() {
                    pressed = false;
                    knobX = centerX;
                    knobY = centerY;
                    drawJoystick();
                });

                canvas.addEventListener("mouseleave", function() {
                    pressed = false;
                    knobX = centerX;
                    knobY = centerY;
                    drawJoystick();
                });

                drawJoystick();
            };

            var joy = new JoyStick("joystick-container");
        });
    </script>
</body>
</html>
