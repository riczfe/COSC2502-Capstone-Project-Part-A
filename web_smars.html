<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrated Drone Controller</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            background-color: white;
            background-image: url('droneimage.jpg');
        }

        #app-container {
            width: 844px;
            height: 390px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            margin-top: 0;
        }

        #controller {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        #slider {
            -webkit-appearance: none;
            appearance: none;
            width: 30%;
            height: 50px;
            transform: rotate(-90deg);
            margin-top: 120px;
            margin-left: -260px;
            border-radius: 50px;
            background: linear-gradient(to right,green, orange, yellow, red);
            outline: none;
            cursor: pointer;
        }

        #slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 40px;
            height: 80px;
            border-radius: 50%;
            background: black;
            cursor: pointer;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
        }

        #slider::-moz-range-thumb {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
        }

        #joystick-container {
            width: 200px;
            height: 200px;
            background-color: transparent;
            position: absolute;
            top: 50%;
            left: 70%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        #status-box {
            background-color: grey;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 20px;
            margin-top: 50px;
            margin-left: 45px;
        }

        #emergency-button {
            background-color: red;
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 20px;
            margin-top: 50px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        #emergency-button:hover {
            background-color: darkred;
        }

        #text1 {
            margin-top: -150px;
            margin-left: 50px;
            font-size: 20px;
            text-align: left;
            justify-content: left;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        #text2 {
            margin-top: -150px;
            margin-left: 30px;
            padding: 50px;
            font-size: 20px;
            text-align: right;
            justify-content: right;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        #slider-value {
            margin-bottom: -100px;
            margin-left: 170px;
            font-size: 18px;
            color: #333;
            position: absolute;
            font-style: italic;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        #container {
            width: 100%;
            height: 49vh;
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 7px;
            touch-action: none;
        }

        #item {
            width: 100px;
            height: 100px;
            background-color: rgb(245, 230, 99);
            border: 10px solid rgba(136, 136, 136, .5);
            border-radius: 50%;
            touch-action: none;
            user-select: none;
        }

        #item:active {
            background-color: rgba(168, 218, 220, 1.00);
        }

        #item:hover {
            cursor: pointer;
            border-width: 20px;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <h1>Drone Controller</h1>
        <div id="controller">
            <p id="text1">Slider Control</p>
            <input placeholder="slider" type="range" id="slider" min="0" max="100" value="0">
            <div id="slider-value">Value: 0</div>
            <div id="status-box">Disconnected</div>
            <p id="text2">Joystick Control</p>
            <div id="joystick-container"></div>
        </div>
        <button id="emergency-button">Emergency Stop</button>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Initialize the joystick
            var joystick = new JoyStick("joystick-container", {
                internalFillColor: "#000000",
                internalStrokeColor: "#ffffff",
                externalStrokeColor: "#52e36e"
            });

            // Initialize the slider to 0
            const slider = document.getElementById("slider");
            const sliderValueDisplay = document.getElementById("slider-value");
            slider.value = 0;

            // Handle slider change
            slider.addEventListener("input", function() {
                console.log("Slider value:", slider.value);
                sliderValueDisplay.textContent = "Value: " + slider.value;
                sendSliderValueToDrone(slider.value);
            });

            // Add slider input event for drone control
            slider.oninput = function() {
                var sliderValue = slider.value;
                send(getMotorValues(joystick.GetX(), joystick.GetY(), sliderValue));
            };

            // Handle emergency button click
            const emergencyButton = document.getElementById("emergency-button");
            emergencyButton.addEventListener("click", function() {
                console.log("Emergency stop triggered!");
                sendEmergencyStopToDrone();
            });

            // Placeholder functions for drone communication
            function sendSliderValueToDrone(value) {
                console.log("Sending slider value to drone:", value);
            }

            function sendEmergencyStopToDrone() {
                console.log("Sending emergency stop to drone");
            }

            function getMotorValues(x, y, sliderValue) {
                // Placeholder for motor value calculation
                console.log(`X: ${x}, Y: ${y}, Slider: ${sliderValue}`);
                return { x: x, y: y, slider: sliderValue };
            }

            // Joystick implementation
            var JoyStick = function(containerId, options) {
                options = options || {};
                var title = options.title || "joystick",
                    width = options.width || 200,
                    height = options.height || 200,
                    internalFillColor = options.internalFillColor || "#000000",
                    internalLineWidth = options.internalLineWidth || 2,
                    internalStrokeColor = options.internalStrokeColor || "#C70039",
                    externalLineWidth = options.externalLineWidth || 2,
                    externalStrokeColor = options.externalStrokeColor || "#900C3F",
                    externalFillColor = options.externalFillColor || "#52e36e",
                    container = document.getElementById(containerId),
                    canvas = document.createElement("canvas");

                canvas.id = title;
                canvas.width = width;
                canvas.height = height;
                container.appendChild(canvas);

                var context = canvas.getContext("2d"),
                    pressed = false,
                    radius = canvas.width / 2 - 20,
                    centerX = canvas.width / 2,
                    centerY = canvas.height / 2,
                    knobX = centerX,
                    knobY = centerY;

                function drawJoystick() {
                    context.clearRect(0, 0, canvas.width, canvas.height);

                    // Draw external circle
                    context.beginPath();
                    context.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    context.lineWidth = externalLineWidth;
                    context.strokeStyle = externalStrokeColor;
                    context.stroke();
                    context.fillStyle = externalFillColor;
                    context.fill();

                    // Draw internal circle
                    context.beginPath();
                    context.arc(knobX, knobY, radius / 2, 0, Math.PI * 2);
                    var gradient = context.createRadialGradient(knobX, knobY, 5, knobX, knobY, 100);
                    gradient.addColorStop(0, internalFillColor);
                    gradient.addColorStop(1, internalStrokeColor);
                    context.fillStyle = gradient;
                    context.fill();
                    context.lineWidth = internalLineWidth;
                    context.strokeStyle = internalStrokeColor;
                    context.stroke();
                }

                canvas.addEventListener("mousedown", function(event) {
                    pressed = true;
                    updateJoystick(event);
                });

                canvas.addEventListener("mousemove", function(event) {
                    if (pressed) {
                        updateJoystick(event);
                    }
                });

                canvas.addEventListener("mouseup", function() {
                    pressed = false;
                    knobX = centerX;
                    knobY = centerY;
                    drawJoystick();
                });

                function updateJoystick(event) {
                    var rect = canvas.getBoundingClientRect();
                    var mouseX = event.clientX - rect.left;
                    var mouseY = event.clientY - rect.top;
                    var deltaX = mouseX - centerX;
                    var deltaY = mouseY - centerY;
                    var distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

                    if (distance < radius) {
                        knobX = mouseX;
                        knobY = mouseY;
                    } else {
                        knobX = centerX + (deltaX / distance) * radius;
                        knobY = centerY + (deltaY / distance) * radius;
                    }

                    drawJoystick();
                }

                drawJoystick();

                this.GetX = function() {
                    return (knobX - centerX) / radius;
                };

                this.GetY = function() {
                    return (knobY - centerY) / radius;
                };
            };
        });
    </script>
</body>
</html>
