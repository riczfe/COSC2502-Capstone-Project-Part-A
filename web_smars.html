<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Controller</title>
    <style>
    body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    background-color: white;
    background-image: url('droneimage.jpg');
}

#app-container {
    width: 844px; /* iPhone 13 height in landscape mode */
    height: 390px; /* iPhone 13 width in landscape mode */
    background-color: white;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    
}

h1 {
    margin-top: 0;
}

#controller {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    width: 100%;
}


#slider {
    -webkit-appearance: none;
    appearance: none;
    width: 30%;
    height: 50px;
    transform: rotate(-90deg); /* Rotate slider to vertical */
    margin-top: 120px;
    margin-left: -260px;
    border-radius: 50px;
    background: linear-gradient(to right,green, orange, yellow, red) ;
    outline: none;
    cursor: pointer;
}

/* Custom slider thumb */
#slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 40px;
    height: 80px;
    border-radius: 50%;
    background: black;
    cursor: pointer;
    box-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
}

#slider::-moz-range-thumb {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    box-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
}

#joystick-container {
    width: 200px; /* Ensure width */
    height: 200px; /* Ensure height */
    background-color: transparent; /* Transparent background */
    position: absolute; /* Position joystick in front */
    top: 50%; /* Center the joystick vertically */
    left: 70%; /* Center the joystick horizontally */
    transform: translate(-50%, -50%); /* Adjust positioning */
    z-index: 10; /* Ensure joystick is on top */
}

#status-box {
    background-color: grey;
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 16px;
    border-radius: 20px;
    margin-top: 50px;
    margin-left: 45px;
}

#emergency-button {
    background-color: red;
    color: white;
    border: none;
    padding: 20px 50px;
    font-size: 16px;
    cursor: pointer;
    border-radius: 20px;
    margin-top: 50px;
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
}

#emergency-button:hover {
    background-color: darkred;
}

#text1 {
    margin-top: -150px;
    margin-left: 50px;
    font-size: 20px;
    text-align: left;
    justify-content: left;
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;

}

#text2 {
    margin-top: -150px;
    margin-left: 30px;
    padding: 50px;
    font-size: 20px;
    text-align: right;
    justify-content: right;
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;

}
#slider-value {
    margin-bottom:-100px;
    margin-left: 170px;
    font-size: 18px;
    color: #333;
    position: absolute;
    font-style: italic;
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
}


.status-connected {
            background-color: green;
        }

.status-disconnected {
            background-color: red;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <h1>Drone Controller</h1>
        <div id="controller">

                <p id="text1">Slider Control</p>
                <input placeholder="slider" type="range" id="slider" min="0" max="100" value="0">
                <div id="slider-value">Value: XX</div>
            <div id="status-box" >Disconnected</div>

                <p id="text2">Joystick Control</p>
                <div id="joystick-container"></div>

        </div>
        <button id="emergency-button" onclick="sendEmergencyStop()">Emergency Stop</button>
    </div>
    <script>
        const view = document.getElementById('stream');
        const WS_URL = "ws://" + window.location.host + ":82";
        const ws = new WebSocket(WS_URL);
        
          // Handle connection status
      const statusBox = document.getElementById("status-box");

        function updateConnectionStatus(isConnected) {
        if (isConnected) {
        statusBox.textContent = "Connected";
        statusBox.classList.remove("status-disconnected");
        statusBox.classList.add("status-connected");
        } else {
        statusBox.textContent = "Disconnected";
        statusBox.classList.remove("status-connected");
        statusBox.classList.add("status-disconnected");
        }
        }

        ws.onmessage = message => {
            if (message.data instanceof Blob) {
                var urlObject = URL.createObjectURL(message.data);
                view.src = urlObject;
            }
        };

        var lastText, lastSend, sendTimeout;
        function send(txt) {
            var now = new Date().getTime();
            if (lastSend === undefined || now - lastSend >= 30) {
                try {
                    ws.send(txt);
                    lastSend = new Date().getTime();
                    return;
                } catch (e) {
                    console.log(e);
                }
            }
            lastText = txt;
            if (!sendTimeout) {
                var ms = lastSend !== undefined ? 30 - (now - lastSend) : 30;
                if (ms < 0)
                    ms = 0;
                sendTimeout = setTimeout(() => {
                    sendTimeout = null;
                    send(lastText);
                }, ms);
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
    // Initialize the joystick
    var joystick = new JoyStick("joystick-container", {
        internalFillColor: "#000000", // Blue color for the joystick
        internalStrokeColor: "#ffffff",
        externalStrokeColor: "#52e36e"
    });

    // Initialize the slider to 0
    const slider = document.getElementById("slider");
    const sliderValueDisplay = document.getElementById("slider-value");
    slider.value = 0; // Ensure slider starts at 0

    // Handle slider change
    slider.addEventListener("input", function() {
        console.log("Slider value:", slider.value);
        sliderValueDisplay.textContent = "Value: " + slider.value; // Update the display value
        // Placeholder: Send the slider value to the drone
        sendSliderValueToDrone(slider.value);
    });
    function getMotorValues(nJoyX, nJoyY, sliderValue) {
            var nMotMixL;
            var nMotMixR;
            var fPivYLimit = 32.0;

            var nMotPremixL;
            var nMotPremixR;
            var nPivSpeed;
            var fPivScale;

            if (nJoyY >= 0) {
                nMotPremixL = (nJoyX >= 0 ? 100.0 : 100.0 + parseFloat(nJoyX));
                nMotPremixR = (nJoyX >= 0 ? 100.0 - nJoyX : 100.0);
            } else {
                nMotPremixL = (nJoyX >= 0 ? 100.0 - nJoyX : 100.0);
                nMotPremixR = (nJoyX >= 0 ? 100.0 : 100.0 + parseFloat(nJoyX));
            }

            nMotPremixL = nMotPremixL * nJoyY / 100.0;
            nMotPremixR = nMotPremixR * nJoyY / 100.0;

            nPivSpeed = nJoyX;
            fPivScale = (Math.abs(nJoyY) > fPivYLimit) ? 0.0 : (1.0 - Math.abs(nJoyY) / fPivYLimit);

            nMotMixL = (1.0 - fPivScale) * nMotPremixL + fPivScale * (nPivSpeed);
            nMotMixR = (1.0 - fPivScale) * nMotPremixR + fPivScale * (-nPivSpeed);

            return Math.round(nMotMixL * 2.55) + "," + Math.round(nMotMixR * 2.55) + "," + sliderValue;
        }

    
    slider.oninput = function() {
            var sliderValue = slider.value;
            send(getMotorValues(joystick.GetX(), joystick.GetY(), sliderValue));
        }

    // Handle emergency button click
    const emergencyButton = document.getElementById("emergency-button");
    emergencyButton.addEventListener("click", function() {
        console.log("Emergency stop triggered!");
        // Placeholder: Send emergency stop command to the drone
        sendEmergencyStopToDrone();
    });
    function sendEmergencyStop() {
            try {
                ws.send("EMERGENCY_STOP");
            } catch (e) {
                console.log(e);
            }
        }

    // Placeholder functions for drone communication
    function sendSliderValueToDrone(value) {
        // Implement the actual communication logic here
        console.log("Sending slider value to drone:", value);
    }

    function sendEmergencyStopToDrone() {
        // Implement the actual communication logic here
        console.log("Sending emergency stop to drone");
    }
});

    setInterval(function () {
            send(getMotorValues(joystick.GetX(), joystick.GetY(), slider.value));
        }, 300);
// Joystick implementation

var JoyStick = function(t, e) {
            e = e || {};
            var i = e.title || "joystick",
                n = e.width || 0,
                o = e.height || 0,
                h = e.internalFillColor || "#000000", // Change internal fill color here
                r = e.internalLineWidth || 2,
                d = e.internalStrokeColor || "#C70039", // Change internal stroke color here
                a = e.externalLineWidth || 2,
                l = e.externalStrokeColor || "#900C3F", // Change external stroke color here
                z = e.externalFillColor || "#52e36e", // New external fill color
                c = document.getElementById(t),
                u = document.createElement("canvas");

            u.id = i;
            if (n == 0) n = c.clientWidth;
            if (o == 0) o = c.clientHeight;
            u.width = n;
            u.height = o;
            c.appendChild(u);

            var s = u.getContext("2d"),
                f = 0,
                v = 2 * Math.PI,
                g = (u.width - 110) / 2,
                w = g + 5,
                C = g + 30,
                m = u.width / 2,
                p = u.height / 2,
                L = u.width / 10,
                E = -1 * L,
                S = u.height / 10,
                k = -1 * S,
                W = m,
                G = p;

            function x() {
                s.beginPath();
                s.arc(m, p, C, 0, v, !1);
                s.lineWidth = a;
                s.strokeStyle = l;
                s.stroke();
            }

            function y() {
                s.beginPath();
                if (W < g) W = w;
                if (W + g > u.width) W = u.width - w;
                if (G < g) G = w;
                if (G + g > u.height) G = u.height - w;
                s.arc(W, G, g, 0, v, !1);
                var t = s.createRadialGradient(m, p, 5, m, p, 200);
                t.addColorStop(0, h);
                t.addColorStop(1, d);
                s.fillStyle = t;
                s.fill();
                s.lineWidth = r;
                s.strokeStyle = d;
                s.stroke();
            }

            if ("ontouchstart" in document.documentElement) {
                u.addEventListener("touchstart", function() {
                    f = 1;
                }, !1);
                u.addEventListener("touchmove", function(t) {
                    t.preventDefault();
                    if (f == 1) {
                        W = t.touches[0].pageX;
                        G = t.touches[0].pageY;
                        W -= u.offsetLeft;
                        G -= u.offsetTop;
                        s.clearRect(0, 0, u.width, u.height);
                        x();
                        y();
                    }
                }, !1);
                u.addEventListener("touchend", function() {
                    f = 0;
                    W = m;
                    G = p;
                    s.clearRect(0, 0, u.width, u.height);
                    x();
                    y();
                }, !1);
            } else {
                u.addEventListener("mousedown", function() {
                    f = 1;
                }, !1);
                u.addEventListener("mousemove", function(t) {
                    if (f == 1) {
                        W = t.pageX;
                        G = t.pageY;
                        W -= u.offsetLeft;
                        G -= u.offsetTop;
                        s.clearRect(0, 0, u.width, u.height);
                        x();
                        y();
                    }
                }, !1);
                u.addEventListener("mouseup", function() {
                    f = 0;
                    W = m;
                    G = p;
                    s.clearRect(0, 0, u.width, u.height);
                    x();
                    y();
                }, !1);
            }

            x();
            y();

            this.GetWidth = function() {
                return u.width;
            }
            this.GetHeight = function() {
                return u.height;
            }
            this.GetPosX = function() {
                return W;
            }
            this.GetPosY = function() {
                return G;
            }
            this.GetX = function() {
                return ((W - m) / w * 100).toFixed();
            }
            this.GetY = function() {
                return ((G - p) / w * -100).toFixed();
            }
            this.GetDir = function() {
                var t = "",
                    e = W - m,
                    i = G - p;
                if (i >= k && i <= S) t = "C";
                if (i < k) t = "N";
                if (i > S) t = "S";
                if (e < E) t += "W";
                if (e > L) t += "E";
                return t;
            }
        };
    
</script>
</body>
</html>
