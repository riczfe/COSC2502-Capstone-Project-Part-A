<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Controller</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            background-color: white;
            background-image: url('droneimage.jpg');
        }

        #app-container {
            width: 844px;
            height: 390px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            margin-top: 0;
        }

        #controller {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        #slider {
            -webkit-appearance: none;
            appearance: none;
            width: 300px;
            height: 50px;
            margin-top: 0px;
            border-radius: 10px;
            background: linear-gradient(to right, green, orange, yellow, red);
            outline: none;
            cursor: pointer;
            transform: rotate(-90deg);
        }

        #slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 40px;
            height: 40px;
            background: black;
            cursor: pointer;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
            border-radius: 50%;
        }

        #joystick-container {
            width: 200px;
            height: 200px;
            background-color: transparent;
            position: absolute;
            top: 50%;
            left: 70%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        #status-box {
            background-color: grey;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 20px;
            margin-top: 50px;
            margin-left: 45px;
        }

        #emergency-button {
            background-color: red;
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 20px;
            margin-top: 50px;
        }

        #text1 {
            margin-top: 20px;
            margin-left: 50px;
            font-size: 20px;
            text-align: left;
            justify-content: left;
        }

        #text2 {
            margin-top: 20px;
            margin-left: 30px;
            padding: 50px;
            font-size: 20px;
            text-align: right;
            justify-content: right;
        }

        #slider-value {
            font-size: 18px;
            color: #333;
            position: absolute;
            left: 20px;
            top: 320px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <h1>Drone Controller</h1>
        <div id="controller">
            <p id="text1">Slider Control</p>
            <input type="range" id="slider" min="0" max="100" value="0">
            <div id="slider-value">Value: 0</div>
            <div id="status-box">Disconnected</div>
            <p id="text2">Joystick Control</p>
            <div id="joystick-container"></div>
        </div>
        <button id="emergency-button">Emergency Stop</button>
    </div>

    <script type="text/javascript">
        // Slider control
        document.addEventListener("DOMContentLoaded", function() {
            var slider = document.getElementById("slider");
            var sliderValueDisplay = document.getElementById("slider-value");

            slider.addEventListener("input", function() {
                sliderValueDisplay.textContent = "Value: " + slider.value;
                console.log("Slider value:", slider.value);
                // Here you can add your code to send the slider value to the drone
            });
        });

        // Joystick control
        var JoyStick = function(containerId, options) {
            options = options || {};
            var title = options.title || "joystick",
                width = options.width || 200,
                height = options.height || 200,
                internalFillColor = options.internalFillColor || "#000000",
                internalStrokeColor = options.internalStrokeColor || "#ffffff",
                externalStrokeColor = options.externalStrokeColor || "#52e36e",
                container = document.getElementById(containerId),
                canvas = document.createElement("canvas");

            canvas.id = title;
            canvas.width = width;
            canvas.height = height;
            container.appendChild(canvas);

            var context = canvas.getContext("2d"),
                pressed = false,
                radius = canvas.width / 2 - 20,
                centerX = canvas.width / 2,
                centerY = canvas.height / 2,
                knobX = centerX,
                knobY = centerY;

            function drawJoystick() {
                context.clearRect(0, 0, canvas.width, canvas.height);

                // Draw external circle
                context.beginPath();
                context.arc(centerX, centerY, radius, 0, Math.PI * 2);
                context.lineWidth = options.externalLineWidth || 2;
                context.strokeStyle = externalStrokeColor;
                context.stroke();
                context.fillStyle = options.externalFillColor || "#52e36e";
                context.fill();

                // Draw internal circle
                context.beginPath();
                context.arc(knobX, knobY, radius / 2, 0, Math.PI * 2);
                context.fillStyle = internalFillColor;
                context.fill();
                context.lineWidth = options.internalLineWidth || 2;
                context.strokeStyle = internalStrokeColor;
                context.stroke();
            }

            canvas.addEventListener("mousedown", function() {
                pressed = true;
            });

            canvas.addEventListener("mousemove", function(event) {
                if (pressed) {
                    var rect = canvas.getBoundingClientRect();
                    var dx = event.clientX - rect.left - centerX;
                    var dy = event.clientY - rect.top - centerY;
                    var distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance > radius) {
                        var angle = Math.atan2(dy, dx);
                        dx = radius * Math.cos(angle);
                        dy = radius * Math.sin(angle);
                    }

                    knobX = centerX + dx;
                    knobY = centerY + dy;
                    drawJoystick();
                }
            });

            canvas.addEventListener("mouseup", function() {
                pressed = false;
                knobX = centerX;
                knobY = centerY;
                drawJoystick();
            });

            canvas.addEventListener("mouseleave", function() {
                pressed = false;
                knobX = centerX;
                knobY = centerY;
                drawJoystick();
            });

            drawJoystick();
        };

        // Initialize Joystick
        document.addEventListener("DOMContentLoaded", function() {
            var joystick = new JoyStick("joystick-container", {
                internalFillColor: "#000000",
                internalStrokeColor: "#ffffff",
                externalStrokeColor: "#52e36e"
            });
        });

        // Emergency button action
        document.getElementById("emergency-button").addEventListener("click", function() {
            console.log("Emergency stop triggered!");
        });
    </script>
</body>
</html>
