    <script type="text/javascript">
        var JoyStick = function(containerId, options) {
            options = options || {};
            var title = options.title || "joystick",
                width = options.width || 200,
                height = options.height || 200,
                internalFillColor = options.internalFillColor || "#000000",  // Change internal fill color here
                internalLineWidth = options.internalLineWidth || 2,           // Internal line width
                internalStrokeColor = options.internalStrokeColor || "#C70039", // Change internal stroke color here
                externalLineWidth = options.externalLineWidth || 2,            // External line width
                externalStrokeColor = options.externalStrokeColor || "#900C3F", // Change external stroke color here
                externalFillColor = options.externalFillColor || "#52e36e", // External fill color (added in paragraph 1)
                container = document.getElementById(containerId),
                canvas = document.createElement("canvas");

            canvas.id = title;
            canvas.width = width;
            canvas.height = height;
            container.appendChild(canvas);

            var context = canvas.getContext("2d"),
                pressed = false,
                radius = canvas.width / 2 - 20,
                centerX = canvas.width / 2,
                centerY = canvas.height / 2,
                knobX = centerX,
                knobY = centerY;

            function drawJoystick() {
                context.clearRect(0, 0, canvas.width, canvas.height);

                // Draw external circle
                context.beginPath();
                context.arc(centerX, centerY, radius, 0, Math.PI * 2);
                context.lineWidth = externalLineWidth;
                context.strokeStyle = externalStrokeColor;
                context.stroke();
                context.fillStyle = externalFillColor; // Set external fill color
                context.fill(); // Fill the external circle

                // Draw internal circle
                context.beginPath();
                context.arc(knobX, knobY, radius / 2, 0, Math.PI * 2);
                var gradient = context.createRadialGradient(knobX, knobY, 5, knobX, knobY, 100);
                gradient.addColorStop(0, internalFillColor);
                gradient.addColorStop(1, internalStrokeColor);
                context.fillStyle = gradient;
                context.fill();
                context.lineWidth = internalLineWidth;
                context.strokeStyle = internalStrokeColor;
                context.stroke();
            }

            canvas.addEventListener("mousedown", function(event) {
                pressed = true;
            });

            canvas.addEventListener("mousemove", function(event) {
                if (pressed) {
                    var rect = canvas.getBoundingClientRect();
                    var dx = event.clientX - rect.left - centerX;
                    var dy = event.clientY - rect.top - centerY;
                    var distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance > radius) {
                        var angle = Math.atan2(dy, dx);
                        dx = radius * Math.cos(angle);
                        dy = radius * Math.sin(angle);
                    }

                    knobX = centerX + dx;
                    knobY = centerY + dy;
                    drawJoystick();
                }
            });

            canvas.addEventListener("mouseup", function() {
                pressed = false;
                knobX = centerX;
                knobY = centerY;
                drawJoystick();
            });

            canvas.addEventListener("mouseleave", function() {
                pressed = false;
                knobX = centerX;
                knobY = centerY;
                drawJoystick();
            });

            drawJoystick();

            this.GetWidth = function() {
                return canvas.width;
            }
            this.GetHeight = function() {
                return canvas.height;
            }
            this.GetPosX = function() {
                return knobX;
            }
            this.GetPosY = function() {
                return knobY;
            }
            this.GetX = function() {
                return ((knobX - centerX) / radius * 100).toFixed();
            }
            this.GetY = function() {
                return ((knobY - centerY) / radius * -100).toFixed();
            }
            this.GetDir = function() {
                var direction = "",
                    xDiff = knobX - centerX,
                    yDiff = knobY - centerY;

                if (yDiff >= -radius / 2 && yDiff <= radius / 2) direction = "C";
                if (yDiff < -radius / 2) direction = "N";
                if (yDiff > radius / 2) direction = "S";
                if (xDiff < -radius / 2) direction += "W";
                if (xDiff > radius / 2) direction += "E";
                return direction;
            }
        };

    </script>

    <script>
        const statusBox = document.getElementById("status-box");
        const view = document.getElementById('stream');
        let ws;  // Declare ws outside the try block

        try {
            const WS_URL = "ws://" + window.location.host + ":82";
            ws = new WebSocket(WS_URL);

            ws.onopen = function() {
                // Connection opened, update status box
                statusBox.innerText = "Connected";
                statusBox.classList.remove("disconnected");
                statusBox.classList.add("connected");
            };

            ws.onclose = function() {
                // Connection closed, update status box
                statusBox.innerText = "Disconnected";
                statusBox.classList.remove("connected");
                statusBox.classList.add("disconnected");
            };

            ws.onerror = function(error) {
                console.error("WebSocket Error: ", error);
                // Handle the error as needed
            };
            
            ws.onmessage = function(message) {
            if (message.data instanceof Blob) {
                var urlObject = URL.createObjectURL(message.data);
                view.src = urlObject;
                }
            };

            var lastText, lastSend, sendTimeout;
            function send(txt) {
                var now = new Date().getTime();
                if (lastSend === undefined || now - lastSend >= 30) {
                    try {
                        ws.send(txt);
                        lastSend = new Date().getTime();
                        return;
                    } catch (e) {
                        console.log(e);
                    }
                }
                lastText = txt;
                if (!sendTimeout) {
                    var ms = lastSend !== undefined ? 30 - (now - lastSend) : 30;
                    if (ms < 0)
                        ms = 0;
                    sendTimeout = setTimeout(() => {
                        sendTimeout = null;
                        send(lastText);
                    }, ms);
                }
            }
        }catch(e){
        console.log(e);
    }

        var joy = new JoyStick('joyDiv');
        var potSlider = document.getElementById("potSlider");

        function getMotorValues(nJoyX, nJoyY, sliderValue) {
            var nMotMixL;
            var nMotMixR;
            var fPivYLimit = 32.0;

            var nMotPremixL;
            var nMotPremixR;
            var nPivSpeed;
            var fPivScale;

            if (nJoyY >= 0) {
                nMotPremixL = (nJoyX >= 0 ? 100.0 : 100.0 + parseFloat(nJoyX));
                nMotPremixR = (nJoyX >= 0 ? 100.0 - nJoyX : 100.0);
            } else {
                nMotPremixL = (nJoyX >= 0 ? 100.0 - nJoyX : 100.0);
                nMotPremixR = (nJoyX >= 0 ? 100.0 : 100.0 + parseFloat(nJoyX));
            }

            nMotPremixL = nMotPremixL * nJoyY / 100.0;
            nMotPremixR = nMotPremixR * nJoyY / 100.0;

            nPivSpeed = nJoyX;
            fPivScale = (Math.abs(nJoyY) > fPivYLimit) ? 0.0 : (1.0 - Math.abs(nJoyY) / fPivYLimit);

            nMotMixL = (1.0 - fPivScale) * nMotPremixL + fPivScale * (nPivSpeed);
            nMotMixR = (1.0 - fPivScale) * nMotPremixR + fPivScale * (-nPivSpeed);

            return Math.round(nMotMixL * 2.55) + "," + Math.round(nMotMixR * 2.55) + "," + sliderValue;
        }

        potSlider.oninput = function() {
            var sliderValue = potSlider.value;
            document.getElementById("slider-value").innerText = "Value: " + sliderValue;
            send(getMotorValues(joy.GetX(), joy.GetY(), sliderValue));
            console.log("Slider value:", sliderValue);

    // Motor values for all four motors
    let motor1 = 50, motor2 = 50, motor3 = 50, motor4 = 50;
  // Ensure motors are reset and not continuously updating if no input is detected
let isMoving = false;
   
    // Update motors only when a change is detected
function updateMotors() {
    if (isMoving) {
        const motorValues = `${motor1},${motor2},${motor3},${motor4}`;
        send(motorValues);  // Sending motor values to the WebSocket server
        console.log(`Motor values: ${motorValues}`);
    }
}


function setMotorValues(forward1, forward2, back1, back2) {
    // Apply motor changes considering the clockwise and counterclockwise motor setup
    motor1 += forward1;
    motor2 += forward2;
    motor3 += back1;
    motor4 += back2;
    isMoving = true;
    updateMotors();  // Send updated motor values
}

// Event listeners for the directional buttons
document.getElementById("btn-up").addEventListener("mousedown", function() {
    setMotorValues(-5, +5, +5, -5);  // Forward: Motor 1 and 4 decrease, 2 and 3 increase
    this.holdInterval = setInterval(() => setMotorValues(-5, +5, +5, -5), 100);
});
document.getElementById("btn-up").addEventListener("mouseup", function() {
    clearInterval(this.holdInterval);
    resetMotors();
});

document.getElementById("btn-down").addEventListener("mousedown", function() {

// Ensure that motor values reset to the slider value when no buttons are pressed
function resetMotors() {

}
