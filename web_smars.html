<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Controller</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            background-color: white;
            background-image: url('droneimage.jpg');
        }
        #controller {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        #app-container {
            width: 844px; /* iPhone 13 height in landscape mode */
            height: 390px; /* iPhone 13 width in landscape mode */
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        #potSlider {
            -webkit-appearance: none;
            appearance: none;
            width: 17%;
            height: 50px;
            transform: rotate(-90deg); /* Rotate slider to vertical */
            border-radius: 50px;
            background: linear-gradient(to right,green, orange, yellow, red) ;
            outline: none;
            cursor: pointer;
            position: absolute;
            top: 370px;
        }
        h1 {
            margin-top: 0;
        }
        /* Custom slider thumb */
        #potSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 40px;
            height: 80px;
            border-radius: 50%;
            background: black;
            cursor: pointer;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
        }

        #potSlider::-moz-range-thumb {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
        }

        #slider-value {
            margin-bottom:-100px;
            margin-left: 170px;
            font-size: 18px;
            color: #333;
            position: absolute;
            font-style: italic;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            top: 400px;
        }
        #status-box {
            background-color: grey;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 20px;
            right: 700px;
            bottom: 450px;
            position: absolute;
        }

        #emergency-button {
            background-color: red;
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 20px;
            right: 0px;
            position: relative;
            top: 150px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        #emergency-button:hover {
            background-color: darkred;
        }

        #text1 {
            margin-top: 40px;
            margin-left: 80px;
            font-size: 20px;
            text-align: left;
            justify-content: left;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            position: absolute;
        }
        #text2 {
            position: absolute;
            right: 420px;
            font-size: 20px;
            text-align: right;
            justify-content: right;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        /* Disconnected State */
        #status-box.disconnected {
            background-color: grey;
            color: white;
        }

        /* Connected State */
        #status-box.connected {
            background-color: green;
            color: white;
        }

        #joyDiv{
            width:200px;
            height:200px;
            margin:50px;
            position: absolute;
            right: 350px;
            bottom: 200px;
            position: absolute;
          
        }
    </style>
    <script type="text/javascript">
        var JoyStick = function(containerId, options) {
            options = options || {};
            var title = options.title || "joystick",
                width = options.width || 200,
                height = options.height || 200,
                internalFillColor = options.internalFillColor || "#000000",  // Change internal fill color here
                internalLineWidth = options.internalLineWidth || 2,           // Internal line width
                internalStrokeColor = options.internalStrokeColor || "#C70039", // Change internal stroke color here
                externalLineWidth = options.externalLineWidth || 2,            // External line width
                externalStrokeColor = options.externalStrokeColor || "#900C3F", // Change external stroke color here
                externalFillColor = options.externalFillColor || "#52e36e", // External fill color (added in paragraph 1)
                container = document.getElementById(containerId),
                canvas = document.createElement("canvas");

            canvas.id = title;
            canvas.width = width;
            canvas.height = height;
            container.appendChild(canvas);

            var context = canvas.getContext("2d"),
                pressed = false,
                radius = canvas.width / 2 - 20,
                centerX = canvas.width / 2,
                centerY = canvas.height / 2,
                knobX = centerX,
                knobY = centerY;

            function drawJoystick() {
                context.clearRect(0, 0, canvas.width, canvas.height);

                // Draw external circle
                context.beginPath();
                context.arc(centerX, centerY, radius, 0, Math.PI * 2);
                context.lineWidth = externalLineWidth;
                context.strokeStyle = externalStrokeColor;
                context.stroke();
                context.fillStyle = externalFillColor; // Set external fill color
                context.fill(); // Fill the external circle

                // Draw internal circle
                context.beginPath();
                context.arc(knobX, knobY, radius / 2, 0, Math.PI * 2);
                var gradient = context.createRadialGradient(knobX, knobY, 5, knobX, knobY, 100);
                gradient.addColorStop(0, internalFillColor);
                gradient.addColorStop(1, internalStrokeColor);
                context.fillStyle = gradient;
                context.fill();
                context.lineWidth = internalLineWidth;
                context.strokeStyle = internalStrokeColor;
                context.stroke();
            }

            canvas.addEventListener("mousedown", function(event) {
                pressed = true;
            });

            canvas.addEventListener("mousemove", function(event) {
                if (pressed) {
                    var rect = canvas.getBoundingClientRect();
                    var dx = event.clientX - rect.left - centerX;
                    var dy = event.clientY - rect.top - centerY;
                    var distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance > radius) {
                        var angle = Math.atan2(dy, dx);
                        dx = radius * Math.cos(angle);
                        dy = radius * Math.sin(angle);
                    }

                    knobX = centerX + dx;
                    knobY = centerY + dy;
                    drawJoystick();
                }
            });

            canvas.addEventListener("mouseup", function() {
                pressed = false;
                knobX = centerX;
                knobY = centerY;
                drawJoystick();
            });

            canvas.addEventListener("mouseleave", function() {
                pressed = false;
                knobX = centerX;
                knobY = centerY;
                drawJoystick();
            });

            drawJoystick();

            this.GetWidth = function() {
                return canvas.width;
            }
            this.GetHeight = function() {
                return canvas.height;
            }
            this.GetPosX = function() {
                return knobX;
            }
            this.GetPosY = function() {
                return knobY;
            }
            this.GetX = function() {
                return ((knobX - centerX) / radius * 100).toFixed();
            }
            this.GetY = function() {
                return ((knobY - centerY) / radius * -100).toFixed();
            }
            this.GetDir = function() {
                var direction = "",
                    xDiff = knobX - centerX,
                    yDiff = knobY - centerY;

                if (yDiff >= -radius / 2 && yDiff <= radius / 2) direction = "C";
                if (yDiff < -radius / 2) direction = "N";
                if (yDiff > radius / 2) direction = "S";
                if (xDiff < -radius / 2) direction += "W";
                if (xDiff > radius / 2) direction += "E";
                return direction;
            }
        };

    </script>
</head>
<body>
    <div id="app-container">
        <h1>Drone Controller</h1>
        <div id="joyDiv" ></div>
        <div id="controller">
            <p id="text1">Slider Control</p>
            <input placeholder="slider" type="range" id="potSlider" min="0" max="100" value="0">
            <div id="slider-value">Value: XX</div>
            <div id="status-box" class="disconnected">Disconnected</div>
            <p id="text2">Joystick Control</p>
        </div>
        <button id="emergency-button">Emergency Stop</button>
    </div>

    <script>
        const statusBox = document.getElementById("status-box");
        const view = document.getElementById('stream');
        let ws;  // Declare ws outside the try block

        try {
            const WS_URL = "ws://" + window.location.host + ":82";
            ws = new WebSocket(WS_URL);

            ws.onopen = function() {
                // Connection opened, update status box
                statusBox.innerText = "Connected";
                statusBox.classList.remove("disconnected");
                statusBox.classList.add("connected");
            };

            ws.onclose = function() {
                // Connection closed, update status box
                statusBox.innerText = "Disconnected";
                statusBox.classList.remove("connected");
                statusBox.classList.add("disconnected");
            };

            ws.onerror = function(error) {
                console.error("WebSocket Error: ", error);
                // Handle the error as needed
            };
            
            ws.onmessage = function(message) {
            if (message.data instanceof Blob) {
                var urlObject = URL.createObjectURL(message.data);
                view.src = urlObject;
                }
            };

            var lastText, lastSend, sendTimeout;
            function send(txt) {
                var now = new Date().getTime();
                if (lastSend === undefined || now - lastSend >= 30) {
                    try {
                        ws.send(txt);
                        lastSend = new Date().getTime();
                        return;
                    } catch (e) {
                        console.log(e);
                    }
                }
                lastText = txt;
                if (!sendTimeout) {
                    var ms = lastSend !== undefined ? 30 - (now - lastSend) : 30;
                    if (ms < 0)
                        ms = 0;
                    sendTimeout = setTimeout(() => {
                        sendTimeout = null;
                        send(lastText);
                    }, ms);
                }
            }
        }catch(e){
        console.log(e);
    }

        var joy = new JoyStick('joyDiv');
        var potSlider = document.getElementById("potSlider");

        function getMotorValues(nJoyX, nJoyY, sliderValue) {
            var nMotMixL;
            var nMotMixR;
            var fPivYLimit = 32.0;

            var nMotPremixL;
            var nMotPremixR;
            var nPivSpeed;
            var fPivScale;

            if (nJoyY >= 0) {
                nMotPremixL = (nJoyX >= 0 ? 100.0 : 100.0 + parseFloat(nJoyX));
                nMotPremixR = (nJoyX >= 0 ? 100.0 - nJoyX : 100.0);
            } else {
                nMotPremixL = (nJoyX >= 0 ? 100.0 - nJoyX : 100.0);
                nMotPremixR = (nJoyX >= 0 ? 100.0 : 100.0 + parseFloat(nJoyX));
            }

            nMotPremixL = nMotPremixL * nJoyY / 100.0;
            nMotPremixR = nMotPremixR * nJoyY / 100.0;

            nPivSpeed = nJoyX;
            fPivScale = (Math.abs(nJoyY) > fPivYLimit) ? 0.0 : (1.0 - Math.abs(nJoyY) / fPivYLimit);

            nMotMixL = (1.0 - fPivScale) * nMotPremixL + fPivScale * (nPivSpeed);
            nMotMixR = (1.0 - fPivScale) * nMotPremixR + fPivScale * (-nPivSpeed);

            return Math.round(nMotMixL * 2.55) + "," + Math.round(nMotMixR * 2.55) + "," + sliderValue;
        }

        potSlider.oninput = function() {
            var sliderValue = potSlider.value;
            document.getElementById("slider-value").innerText = "Value: " + sliderValue;
            send(getMotorValues(joy.GetX(), joy.GetY(), sliderValue));
            console.log("Slider value:", sliderValue);
        }
        // Add an event listener to the emergency stop button
        document.getElementById("emergency-button").addEventListener("click", function() {
            sendEmergencyStop();  // Call the function to send the emergency stop signal
        });

        // Function to send emergency stop command
        function sendEmergencyStop() {
            if (ws && ws.readyState === WebSocket.OPEN) {  // Check if WebSocket is connected
                ws.send("EMERGENCY_STOP");  // Send "EMERGENCY_STOP" message via WebSocket
            } else {
                console.log("WebSocket is not connected. Cannot send emergency stop.");
            }
        }

        // Periodically send motor values
        setInterval(function () {
            send(getMotorValues(joy.GetX(), joy.GetY(), potSlider.value));
        }, 300);
</script>

</body>
</html>
