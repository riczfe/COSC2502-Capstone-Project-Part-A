<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Controller</title>
    <style>
        /* Global Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            width: 100vw;
            background-color: #05051a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow: hidden; /* Fix elements moving on zoom */
        }

        /* Light Mode */
        body.light-mode {
            background-color: #f4f4f9;
            color: #333;
        }

        /* Header Section */
        h1 {
            color: white;
            margin-bottom: 4vh;
            position: fixed; /* Fix the position */
            top: 20px; /* Move it to the top */
        }

        body.light-mode h1 {
            color: #333;
        }

        /* Light/Dark Mode Toggle Button */
        #mode-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            transition: background-color 0.3s ease;
        }

        #mode-toggle:hover {
            background-color: #555;
        }

        /* Container to hold slider, buttons and joystick */
        .control-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 80vw;
            height: 60vh;
        }

        /* Slider Section */
        .slider-wrapper {
            position: relative;
            height: 20rem;
            width: 3rem;
        }

        .slider-wrapper::before, 
        .slider-wrapper::after {
            display: block;
            position: absolute;
            z-index: 99;
            color: #fff;
            width: 100%;
            text-align: center;
            font-size: 1.5rem;
            line-height: 1;
            padding: 0.75rem 0;
            pointer-events: none;
        }

        .slider-wrapper::before {
            content: "+";
        }

        .slider-wrapper::after {
            content: "−";
            bottom: 0;
        }

        input[type=range] {
            -webkit-appearance: none;
            background-color: rgba(255, 255, 255, 0.2);
            position: absolute;
            top: 50%;
            left: 50%;
            margin: 0;
            padding: 0;
            width: 20rem;
            height: 3.5rem;
            transform: translate(-50%, -50%) rotate(-90deg);
            border-radius: 1rem;
            overflow: hidden;
            cursor: row-resize;
        }

        input[type=range][step] {
            background-color: transparent;
            background-image: repeating-linear-gradient(to right, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.2) calc(12.5% - 1px), #05051a 12.5%);
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 0;
            box-shadow: -20rem 0 0 20rem rgba(255, 255, 255, 0.2);
        }

        input[type=range]::-moz-range-thumb {
            border: none;
            width: 0;
            box-shadow: -20rem 0 0 20rem rgba(255, 255, 255, 0.2);
        }

        /* Light mode slider */
        body.light-mode input[type=range] {
            background-color: rgb(24 41 41);
        }

        /* Number Buttons Section */
        .number-buttons {
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            width: 200px;
            margin: 0 40px;
        }

        .number-buttons button {
            width: 40px;
            height: 40px;
            font-size: 18px;
            border: none;
            background-color: #333;
            color: white;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .number-buttons button:hover {
            background-color: #555;
        }

        body.light-mode .number-buttons button {
            background-color: #888;
        }

        /* Joystick Section */
        #joystick-container {
            width: 200px;
            height: 200px;
            position: relative;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            overflow: hidden;
            user-select: none;
            border-style: double;
        }

        #joystick-handle {
            width: 70px;
            height: 70px;
            background-color: #333;
            border-radius: 50%;
            position: absolute;
            left: calc(50% - 35px);
            top: calc(50% - 35px);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            transition: none;
        }

        body.light-mode #joystick-handle {
            background-color: #888;
        }

        /* Emergency Stop Button */
        #emergency-button {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: red;
            color: white;
            padding: 20px 40px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        #emergency-button:hover {
            background-color: darkred;
        }

        /* Status Box */
        #status-box {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background-color: green;
            color: white;
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 10px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
    </style>
</head>
<body class="light-mode">

    <!-- Header Section -->
    <h1>Drone Controller</h1>

    <!-- Light/Dark Mode Toggle Button -->
    <button id="mode-toggle">Switch to Dark Mode</button>

    <!-- Controller Section -->
    <div class="control-container">
        <!-- Slider Section -->
        <div class="slider-wrapper">
            <input type="range" min="0" max="100" value="0" step="12.5">
        </div>

        <!-- Number Buttons Section -->
        <div class="number-buttons">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
        </div>

        <!-- Joystick Section -->
        <div id="joystick-container">
            <div id="joystick-handle"></div>
        </div>
    </div>

    <!-- Status Box -->
    <div id="status-box">Connected</div>

    <!-- Emergency Button -->
    <button id="emergency-button">Emergency Stop</button>

    <script>
        // Light/Dark Mode Toggle
        const toggleButton = document.getElementById('mode-toggle');
        const bodyElement = document.body;

        toggleButton.addEventListener('click', () => {
            if (bodyElement.classList.contains('light-mode')) {
                bodyElement.classList.replace('light-mode', 'dark-mode');
                toggleButton.textContent = 'Switch to Light Mode';
            } else {
                bodyElement.classList.replace('dark-mode', 'light-mode');
                toggleButton.textContent = 'Switch to Dark Mode';
            }
        });

        // Joystick movement logic
        const joystickHandle = document.getElementById('joystick-handle');
        const joystickContainer = document.getElementById('joystick-container');
        const maxMoveDistance = joystickContainer.offsetWidth / 2;

        let joystickCenterX = joystickContainer.offsetWidth / 2;
        let joystickCenterY = joystickContainer.offsetHeight / 2;

        function moveJoystick(e) {
            const rect = joystickContainer.getBoundingClientRect();
            const x = e.clientX - rect.left - joystickCenterX;
            const y = e.clientY - rect.top - joystickCenterY;
            const distance = Math.sqrt(x * x + y * y);

            if (distance < maxMoveDistance) {
                joystickHandle.style.left = `${x + joystickCenterX - joystickHandle.offsetWidth / 2}px`;
                joystickHandle.style.top = `${y + joystickCenterY - joystickHandle.offsetHeight / 2}px`;
            } else {
                const angle = Math.atan2(y, x);
                joystickHandle.style.left = `${Math.cos(angle) * maxMoveDistance + joystickCenterX - joystickHandle.offsetWidth / 2}px`;
                joystickHandle.style.top = `${Math.sin(angle) * maxMoveDistance + joystickCenterY - joystickHandle.offsetHeight / 2}px`;
            }
        }

        joystickContainer.addEventListener('mousedown', function () {
            document.onmousemove = function (e) {
                moveJoystick(e);
            };
        });

        document.addEventListener('mouseup', function () {
            document.onmousemove = null;
            joystickHandle.style.left = 'calc(50% - 35px)';
            joystickHandle.style.top = 'calc(50% - 35px)';
        });

        joystickContainer.addEventListener('touchstart', function (e) {
            document.ontouchmove = function (e) {
                moveJoystick(e.touches[0]);
            };
        });

        document.addEventListener('touchend', function () {
            document.ontouchmove = null;
            joystickHandle.style.left = 'calc(50% - 35px)';
            joystickHandle.style.top = 'calc(50% - 35px)';
        });
    </script>

</body>
</html>
